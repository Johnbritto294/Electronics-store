<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found · Stackly</title>
<meta name="description" content="The requested frequency doesn't exist or has moved. Return home or go back to your previous page.">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/stackly.css">
</head>
<body>

<div id="preloader">
  <div class="pl-mark"><img src="logo_green.webp" alt="Stackly" class="pl-logo"></div>
  <div class="pl-pct" id="plPct">0%</div>
  <div class="pl-bar"><i id="plBar"></i></div>
</div>

<div class="cursor-ring" id="cRing"></div>
<div class="cursor-dot" id="cDot"></div>
<div class="toast-s" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toastMsg"></span></div>
<button class="to-top" id="toTop" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>



<!-- 404 MAIN HERO SECTION -->
<main>
  <section class="page-404">
    <div class="container text-center">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          
          <div class="chip mb-4"><i class="dot"></i> Circuit 404 · Signal Lost</div>
          
          <div>
            <div class="display-404">404</div>
          </div>
          
          <h1 style="font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;margin-bottom:18px;">
            Frequency disconnected.<br>Page not found.
          </h1>
          
          <p class="muted mx-auto mb-4" style="max-width:540px;font-size:1.05rem;line-height:1.7;">
            The device or frequency you are looking for has been relocated, powered down, or never existed in our catalog.
          </p>

          <!-- ACTION BUTTONS: GO TO HOME & BACK TO PREVIOUS -->
          <div class="d-flex justify-content-center align-items-center gap-3 flex-wrap mb-4">
            <a href="index.html" class="btn-volt magnetic">
              <i class="fa-solid fa-house"></i> Go to Home
            </a>
            <button type="button" class="btn-ghost magnetic" id="backToPreviousBtn">
              <i class="fa-solid fa-arrow-left"></i> Back to Previous
            </button>
          </div>



        </div>
      </div>



    </div>
  </section>
</main>



<!-- CART DRAWER -->
<div class="offcanvas offcanvas-end offcanvas-cart" tabindex="-1" id="cartDrawer">
  <div class="offcanvas-header" style="border-bottom:1px solid var(--line);">
    <h5 class="m-0" style="font-size:1.1rem;">Your bag <span class="muted mono" style="font-size:.8rem;">(<span class="cartCount">0</span>)</span></h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column">
    <div id="cartItems" class="flex-grow-1"></div>
    <div style="border-top:1px solid var(--line);padding-top:18px;">
      <div class="d-flex justify-content-between mb-3"><span class="muted">Subtotal</span><b class="display" id="cartTotal">$0</b></div>
      <button class="btn-ink w-100 justify-content-center border-0" id="checkoutBtn">Checkout <i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="assets/js/stackly.js"></script>
<script>
  // Dedicated Previous History Navigation for 404
  const backBtn = document.getElementById('backToPreviousBtn');
  if (backBtn) {
    backBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (document.referrer && window.history.length > 1) {
        window.history.back();
      } else if (window.history.length > 1) {
        window.history.go(-1);
      } else {
        window.location.href = 'index.html';
      }
    });
  }

  // Display previous referrer page name
  const prevRefName = document.getElementById('prevRefName');
  if (prevRefName) {
    if (document.referrer) {
      try {
        const u = new URL(document.referrer);
        let path = u.pathname.split('/').pop() || 'Home';
        if (!path || path === '') path = 'Home';
        prevRefName.textContent = path.replace('.html', '').toUpperCase();
      } catch (err) {
        prevRefName.textContent = 'Previous Page';
      }
    } else {
      prevRefName.textContent = 'Home';
    }
  }
</script>
</body>
</html>
